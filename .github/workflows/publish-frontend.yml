name: Publish frontend image

on:
  push:
    tags:
      - 'frontend-v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Validate tag and set image name
        id: image
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^frontend-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected a tag like frontend-v0.0.1" >&2
            exit 1
          fi
          echo "version=${GITHUB_REF_NAME#frontend-}" >> "$GITHUB_OUTPUT"
          echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/todolist-front" >> "$GITHUB_OUTPUT"

      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
