services:
  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "3000:3000"
  api:
    build: ./backend
    depends_on:
      - mongo
    ports:
      - "3001:3001"
  
  mongo:
    image: mongo
    restart: always
    volumes: 
      - mongodb_data:/data/db
    environment: 
      MONGODB_INITDB_ROOT_USERNAME: username
      MONGODB_INITDB_ROOT_PASSWORD: password
    # uncomment following lines to access db locally
    # ports:
    #   - 27017:27017

volumes: 
  mongodb_data:
